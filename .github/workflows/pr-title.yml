name: PR Title

on:
  pull_request_target:
    types: [opened, edited, reopened, synchronize]

permissions:
  pull-requests: read

jobs:
  lint:
    name: Lint the PR title
    runs-on: ubuntu-latest
    steps:
      - name: Check the title against Conventional Commits
        uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            refactor
            perf
            test
            build
            ci
            chore
          scopes: |
            barter
            config
            messages
            command
            gp
            build
          requireScope: false
          # release-please titles its PRs "chore(main): release X", and main
          # is a branch, not a scope contributors should use.
          ignoreLabels: |
            autorelease: pending
          subjectPattern: ^(?![A-Z]).+[^.]$
          subjectPatternError: |
            The subject must start with a lowercase letter and must not end with a period.
