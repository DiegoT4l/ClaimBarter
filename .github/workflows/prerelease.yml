name: Pre-release

on:
  push:
    branches: [staging]

permissions:
  contents: write

concurrency:
  group: prerelease
  cancel-in-progress: false

jobs:
  prerelease:
    name: Build and publish a release candidate
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Resolve the candidate version
        id: version
        run: |
          base="$(./mvnw -B -q help:evaluate -Dexpression=project.version -DforceStdout | tr -d '[:space:]')"
          base="${base%-SNAPSHOT}"
          echo "value=${base}-rc.${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Set the candidate version in the workspace only
        run: ./mvnw -B versions:set -DnewVersion=${{ steps.version.outputs.value }} -DgenerateBackupPoms=false

      - name: Build and package
        run: ./mvnw -B package

      - name: Create the GitHub prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${{ steps.version.outputs.value }}" \
            "target/ClaimBarter-${{ steps.version.outputs.value }}.jar" \
            --title "v${{ steps.version.outputs.value }}" \
            --notes "Release candidate built from staging at ${{ github.sha }}. Not a stable release." \
            --prerelease \
            --target "${{ github.sha }}"

      - name: Publish to the Hangar Snapshot channel
        uses: benwoo1110/hangar-upload-action@970ef155684950e7ab459edf0b1844aba9c7442d # v1
        with:
          api_token: ${{ secrets.HANGAR_API_TOKEN }}
          slug: ClaimBarter
          version: ${{ steps.version.outputs.value }}
          channel: Snapshot
          files: '[{"path": "target/ClaimBarter-${{ steps.version.outputs.value }}.jar", "platforms": ["PAPER"]}]'

      - name: Assert nothing was committed
        run: |
          head="$(git rev-parse HEAD)"
          if [ "$head" != "${{ github.sha }}" ]; then
            echo "HEAD moved from ${{ github.sha }} to $head. This workflow must never commit."
            git log --oneline "${{ github.sha }}..$head"
            exit 1
          fi
          if [ -n "$(git status --porcelain CHANGELOG.md .release-please-manifest.json)" ]; then
            echo "This workflow modified release-please state. Only pom.xml may change, and only in the workspace."
            git status --porcelain CHANGELOG.md .release-please-manifest.json
            exit 1
          fi
          echo "HEAD unchanged at $head; release-please state untouched. pom.xml is modified in the workspace only, as intended."
