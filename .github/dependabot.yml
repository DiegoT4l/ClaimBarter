version: 2
updates:
  - package-ecosystem: maven
    directory: "/"
    target-branch: dev
    schedule:
      interval: weekly
    commit-message:
      prefix: "build"
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: "/"
    target-branch: dev
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"
    open-pull-requests-limit: 5
