name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  release:
    name: Attach the jar and publish to Hangar
    runs-on: ubuntu-latest
    if: ${{ !github.event.release.prerelease }}
    steps:
      - name: Check out the released tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Build and package
        run: ./mvnw -B package

      - name: Resolve the released version
        id: version
        run: echo "value=$(./mvnw -B -q help:evaluate -Dexpression=project.version -DforceStdout | tr -d '[:space:]')" >> "$GITHUB_OUTPUT"

      - name: Attach the jar to the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" \
            "target/ClaimBarter-${{ steps.version.outputs.value }}.jar" \
            --clobber

      - name: Publish to the Hangar Release channel
        uses: benwoo1110/hangar-upload-action@970ef155684950e7ab459edf0b1844aba9c7442d # v1
        with:
          api_token: ${{ secrets.HANGAR_API_TOKEN }}
          slug: ClaimBarter
          version: ${{ steps.version.outputs.value }}
          channel: Release
          files: '[{"path": "target/ClaimBarter-${{ steps.version.outputs.value }}.jar", "platforms": ["PAPER"]}]'
