name: Bug report
description: Something does not work the way it is documented.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Before filing, please check the compatibility matrix in
        [SECURITY.md](https://github.com/DiegoT4l/ClaimBarter/blob/main/SECURITY.md). Spigot is not supported, and
        GriefPrevention requires Paper 1.21.10 or newer.

  - type: input
    id: claimbarter-version
    attributes:
      label: ClaimBarter version
      description: Exact version of the jar you installed, including any -rc suffix.
      placeholder: "1.0.0"
    validations:
      required: true

  - type: textarea
    id: server-version
    attributes:
      label: Output of /version
      description: Run `/version` on the server and paste the full output.
      render: text
    validations:
      required: true

  - type: textarea
    id: griefprevention-version
    attributes:
      label: Output of /version GriefPrevention
      description: Run `/version GriefPrevention` and paste the full output.
      render: text
    validations:
      required: true

  - type: textarea
    id: config
    attributes:
      label: Your config.yml
      description: Paste the whole file. Redact nothing - there are no secrets in it.
      render: yaml
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Console output
      description: Paste any stack trace or relevant log lines, or link to a paste service.
      render: text
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: What did you run, what did you expect, what happened instead.
      placeholder: |
        1. Give the player 10 iron ingots
        2. Run /claimbarter buy 10
        3. Expected 1000 claim blocks, got ...
    validations:
      required: true
