name: Release

on:
  release:
    types: [published]
  # A release published with GITHUB_TOKEN never fires the release event, so
  # release-please dispatches this workflow itself. Also lets a tag be
  # republished by hand.
  workflow_dispatch:
    inputs:
      tag:
        description: The release tag to build and publish, for example v1.0.1.
        required: true

permissions:
  contents: write

env:
  TAG: ${{ github.event.release.tag_name || inputs.tag }}

jobs:
  release:
    name: Attach the jar and publish to Hangar
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || !github.event.release.prerelease }}
    steps:
      - name: Check out the released tag
        uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Build and package
        run: ./mvnw -B package

      - name: Resolve the released version
        id: version
        run: echo "value=$(./mvnw -B -q help:evaluate -Dexpression=project.version -DforceStdout | tr -d '[:space:]')" >> "$GITHUB_OUTPUT"

      - name: Attach the jar to the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ env.TAG }}" \
            "target/ClaimBarter-${{ steps.version.outputs.value }}.jar" \
            --clobber

      - name: Publish to the Hangar Release channel
        uses: benwoo1110/hangar-upload-action@970ef155684950e7ab459edf0b1844aba9c7442d # v1
        with:
          api_token: ${{ secrets.MCPAPER_API_KEY }}
          slug: ClaimBarter
          version: ${{ steps.version.outputs.value }}
          channel: Release
          files: '[{"path": "target/ClaimBarter-${{ steps.version.outputs.value }}.jar", "platforms": ["PAPER"]}]'
          platform_dependencies: '{"PAPER": ["1.21.10", "1.21.11", "26.2"]}'
          plugin_dependencies: '{"PAPER": [{"name": "GriefPrevention", "required": true, "externalUrl": null, "platform": "PAPER"}]}'
